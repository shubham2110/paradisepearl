<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Paradise Pearl Accounting Dashboard</title>
<meta name="description" content="Society Transaction Dashboard for Paradise Pearl Accounting" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/recharts@2.15.4/umd/Recharts.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f6f8;--card:#fff;--border:#e2e5ea;--text:#1a1e2e;--muted:#6b7280;
  --primary:#0d9668;--primary-light:#ecfdf5;--danger:#dc2626;--danger-light:#fef2f2;
  --accent:#3b82f6;--shadow:0 1px 3px rgba(0,0,0,.08);
}
body{font-family:'Space Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.container{max-width:1152px;margin:0 auto;padding:0 16px}

/* Header */
.header{background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;padding:12px 0}
.header-inner{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:12px}
.logo-icon{width:36px;height:36px;border-radius:8px;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px}
.logo h1{font-size:18px;font-weight:700;letter-spacing:-.3px}
.logo p{font-size:11px;color:var(--muted)}
.settings-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--muted)}
.settings-btn:hover{background:var(--bg)}
.settings-panel{border-top:1px solid var(--border);background:var(--bg);padding:16px 0;display:none}
.settings-panel.open{display:block}
.settings-row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;color:var(--muted);font-weight:500}
.field input{border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:13px;font-family:inherit;width:320px}
.field input:focus{outline:2px solid var(--primary);outline-offset:-1px}
.load-btn{background:var(--primary);color:#fff;border:none;border-radius:6px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.load-btn:hover{opacity:.9}
.load-btn:disabled{opacity:.5;cursor:not-allowed}

/* Tabs */
.tabs{display:flex;gap:4px;background:#e5e7eb;border-radius:8px;padding:3px;width:fit-content;margin-bottom:20px}
.tab{padding:6px 16px;border-radius:6px;font-size:13px;font-weight:500;border:none;cursor:pointer;background:transparent;color:var(--muted);font-family:inherit}
.tab.active{background:var(--card);color:var(--text);box-shadow:var(--shadow)}

/* Filters */
.filters{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:20px}
.filters-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.filters-header span{font-size:13px;font-weight:600}
.clear-btn{background:none;border:none;font-size:11px;color:var(--muted);cursor:pointer;text-decoration:underline}
.filter-row{display:flex;gap:10px;flex-wrap:wrap}
.filter-select,.filter-input{border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px;font-family:inherit;background:var(--card)}
.filter-select:focus,.filter-input:focus{outline:2px solid var(--primary);outline-offset:-1px}

/* Cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;cursor:pointer;transition:box-shadow .15s}
.card:hover{box-shadow:0 4px 12px rgba(0,0,0,.08)}
.card-label{font-size:12px;color:var(--muted);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.card-label .dot{width:8px;height:8px;border-radius:50%}
.card-value{font-size:22px;font-weight:700}
.card-value.income{color:var(--primary)}
.card-value.expense{color:var(--danger)}
.card-hint{font-size:10px;color:var(--muted);margin-top:4px}

/* Charts */
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:14px;margin-bottom:20px}
@media(max-width:860px){.charts-grid{grid-template-columns:1fr}}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px}
.chart-card h3{font-size:13px;font-weight:600;margin-bottom:2px}
.chart-card .hint{font-size:10px;color:var(--muted);margin-bottom:14px}
.chart-full{margin-bottom:20px}

/* Drawer / Overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:480px;max-width:100vw;background:var(--card);z-index:60;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-header{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:start}
.drawer-header h2{font-size:15px;font-weight:600}
.drawer-header .meta{font-size:12px;color:var(--muted);margin-top:2px}
.drawer-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);padding:4px}
.drawer-body{flex:1;overflow-y:auto}
.txn-item{display:flex;justify-content:space-between;align-items:start;padding:12px 20px;border-bottom:1px solid var(--border);gap:12px}
.txn-item:hover{background:var(--bg)}
.txn-left{display:flex;gap:10px;min-width:0}
.txn-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;margin-top:2px}
.txn-icon.inc{background:var(--primary-light);color:var(--primary)}
.txn-icon.exp{background:var(--danger-light);color:var(--danger)}
.txn-party{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txn-meta{display:flex;gap:6px;align-items:center;margin-top:2px;flex-wrap:wrap}
.txn-badge{font-size:10px;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:1px 6px;color:var(--muted)}
.txn-month{font-size:10px;color:var(--muted)}
.txn-details{font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.txn-amount{font-size:13px;font-weight:600;flex-shrink:0}
.txn-amount.inc{color:var(--primary)}
.txn-amount.exp{color:var(--danger)}

/* Table */
.data-table-wrap{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:auto;max-height:600px}
.data-table{width:100%;border-collapse:collapse;font-size:12px}
.data-table th{position:sticky;top:0;background:var(--bg);font-weight:600;text-align:left;padding:10px 12px;border-bottom:2px solid var(--border)}
.data-table td{padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
.data-table tr:hover td{background:var(--bg)}

/* Loading */
.loading{display:flex;flex-direction:column;gap:10px;padding:40px 0}
.shimmer{height:40px;border-radius:6px;background:linear-gradient(90deg,#e5e7eb 25%,#f3f4f6 50%,#e5e7eb 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.footer{text-align:center;font-size:11px;color:var(--muted);padding:16px 0}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useCallback } = React;
const { BarChart, Bar, PieChart, Pie, Cell, LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Legend } = Recharts;

const SHEET_URL = "https://docs.google.com/spreadsheets/d/1DWneI8gyV07VqpoZzyW6qLURD5z4voj-l_--VpxBO8g/edit?usp=sharing";
const SHEET_NAME = "Responses";
const COLORS = ["#0d9668","#3b82f6","#f59e0b","#dc2626","#8b5cf6","#0891b2","#eab308","#ec4899","#22c55e","#0ea5e9","#f97316","#7c3aed"];

// --- Utility Functions ---
function extractSheetId(url) {
  const m = url.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);
  return m ? m[1] : null;
}

function getSheetCsvUrl(url, sheetName) {
  const id = extractSheetId(url);
  if (!id) return null;
  let csvUrl = `https://docs.google.com/spreadsheets/d/${id}/export?format=csv`;
  if (sheetName) csvUrl += `&sheet=${encodeURIComponent(sheetName)}`;
  return csvUrl;
}

function parseCsv(text) {
  const rows = [];
  let current = [];
  let cell = "";
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (ch === '"') inQuotes = false;
      else cell += ch;
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === ',') { current.push(cell); cell = ""; }
      else if (ch === '\n' || (ch === '\r' && text[i + 1] === '\n')) {
        current.push(cell); cell = ""; rows.push(current); current = [];
        if (ch === '\r') i++;
      } else cell += ch;
    }
  }
  if (cell || current.length) { current.push(cell); rows.push(current); }
  return rows;
}

async function fetchSheetData(url, sheetName) {
  const csvUrl = getSheetCsvUrl(url, sheetName);
  if (!csvUrl) throw new Error("Invalid Google Sheets URL");
  const res = await fetch(csvUrl);
  if (!res.ok) throw new Error("Failed to fetch sheet data");
  const text = await res.text();
  const rows = parseCsv(text).filter(r => r.some(c => c.trim()));
  if (rows.length < 2) throw new Error("Sheet has no data");
  return { headers: rows[0], rows: rows.slice(1) };
}

function parseMonthYear(str) {
  if (!str) return "";
  const parts = str.split("/");
  if (parts.length === 3) {
    const month = parseInt(parts[1], 10);
    let year = parseInt(parts[2], 10);
    if (year < 100) year += 2000;
    const names = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    if (month >= 1 && month <= 12) return `${names[month - 1]} ${year}`;
  }
  return str;
}

function dateFromMonthYear(str) {
  if (!str) return null;
  const parts = str.split("/");
  if (parts.length !== 3) return null;
  const month = parseInt(parts[1], 10);
  let year = parseInt(parts[2], 10);
  if (year < 100) year += 2000;
  if (month >= 1 && month <= 12) return new Date(year, month - 1, 1);
  return null;
}

function parseTransactions(rows) {
  return rows.map(row => ({
    timestamp: row[0] || "",
    type: (row[1] || "").trim(),
    category: (row[2] || "").trim(),
    party: (row[3] || "").trim(),
    date: dateFromMonthYear(row[5] || ""),
    monthYear: parseMonthYear(row[5] || ""),
    amount: parseFloat(row[6]) || 0,
    paymentDetails: (row[8] || "").trim(),
  })).filter(t => t.type === "Income" || t.type === "Expense");
}

function getUnique(txns, key) {
  const s = new Set();
  txns.forEach(t => { const v = String(t[key] || ""); if (v) s.add(v); });
  return [...s].sort();
}

function fmt(n) { return "₹" + n.toLocaleString("en-IN"); }

// --- Components ---
function TransactionDrawer({ open, onClose, transactions, title }) {
  const total = transactions.reduce((s, t) => s + t.amount, 0);
  return (
    <>
      <div className={`overlay ${open ? "open" : ""}`} onClick={onClose} />
      <div className={`drawer ${open ? "open" : ""}`}>
        <div className="drawer-header">
          <div>
            <h2>{title}</h2>
            <div className="meta">{transactions.length} transaction{transactions.length !== 1 ? "s" : ""} · {fmt(total)}</div>
          </div>
          <button className="drawer-close" onClick={onClose}>✕</button>
        </div>
        <div className="drawer-body">
          {transactions.map((t, i) => (
            <div className="txn-item" key={i}>
              <div className="txn-left">
                <div className={`txn-icon ${t.type === "Income" ? "inc" : "exp"}`}>
                  {t.type === "Income" ? "↑" : "↓"}
                </div>
                <div style={{minWidth:0}}>
                  <div className="txn-party">{t.party || "Unknown"}</div>
                  <div className="txn-meta">
                    <span className="txn-badge">{t.category}</span>
                    {t.monthYear && <span className="txn-month">{t.monthYear}</span>}
                  </div>
                  {t.paymentDetails && <div className="txn-details">{t.paymentDetails}</div>}
                </div>
              </div>
              <div className={`txn-amount ${t.type === "Income" ? "inc" : "exp"}`}>{fmt(t.amount)}</div>
            </div>
          ))}
          {transactions.length === 0 && <div style={{padding:"40px 20px",textAlign:"center",color:"var(--muted)",fontSize:13}}>No transactions found</div>}
        </div>
      </div>
    </>
  );
}

function Dashboard({ transactions }) {
  const [typeFilter, setTypeFilter] = useState("all");
  const [categoryFilter, setCategoryFilter] = useState("all");
  const [monthYearFilter, setMonthYearFilter] = useState("all");
  const [dateFrom, setDateFrom] = useState("");
  const [dateTo, setDateTo] = useState("");
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [drawerTitle, setDrawerTitle] = useState("");
  const [drawerTxns, setDrawerTxns] = useState([]);

  const categories = useMemo(() => getUnique(transactions, "category"), [transactions]);
  const monthYears = useMemo(() => getUnique(transactions, "monthYear"), [transactions]);

  const filtered = useMemo(() => {
    const from = dateFrom ? new Date(dateFrom) : null;
    const to = dateTo ? new Date(dateTo) : null;
    return transactions.filter(t => {
      if (typeFilter !== "all" && t.type !== typeFilter) return false;
      if (categoryFilter !== "all" && t.category !== categoryFilter) return false;
      if (monthYearFilter !== "all" && t.monthYear !== monthYearFilter) return false;
      if (from && t.date && t.date < from) return false;
      if (to && t.date && t.date > to) return false;
      return true;
    });
  }, [transactions, typeFilter, categoryFilter, monthYearFilter, dateFrom, dateTo]);

  const totalIncome = useMemo(() => filtered.filter(t => t.type === "Income").reduce((s, t) => s + t.amount, 0), [filtered]);
  const totalExpense = useMemo(() => filtered.filter(t => t.type === "Expense").reduce((s, t) => s + t.amount, 0), [filtered]);
  const balance = totalIncome - totalExpense;

  const categoryData = useMemo(() => {
    const m = new Map();
    filtered.forEach(t => m.set(t.category, (m.get(t.category) || 0) + t.amount));
    return [...m.entries()].map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
  }, [filtered]);

  const monthlyTrend = useMemo(() => {
    const m = new Map();
    filtered.forEach(t => {
      if (!t.monthYear) return;
      const e = m.get(t.monthYear) || { income: 0, expense: 0 };
      if (t.type === "Income") e.income += t.amount; else e.expense += t.amount;
      m.set(t.monthYear, e);
    });
    const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return [...m.entries()].map(([month, d]) => ({ month, ...d })).sort((a, b) => {
      const p = s => { const [mn, yr] = s.split(" "); return parseInt(yr) * 12 + months.indexOf(mn); };
      return p(a.month) - p(b.month);
    });
  }, [filtered]);

  const typeData = useMemo(() => [{ name: "Income", value: totalIncome }, { name: "Expense", value: totalExpense }], [totalIncome, totalExpense]);

  const partyData = useMemo(() => {
    const m = new Map();
    filtered.forEach(t => { if (t.party) m.set(t.party, (m.get(t.party) || 0) + t.amount); });
    return [...m.entries()].map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value).slice(0, 10);
  }, [filtered]);

  const cumulativeData = useMemo(() => {
    let bal = 0;
    return monthlyTrend.map(item => { bal += item.income - item.expense; return { month: item.month, balance: bal }; });
  }, [monthlyTrend]);

  const showDrawer = useCallback((title, txns) => { setDrawerTitle(title); setDrawerTxns(txns); setDrawerOpen(true); }, []);

  const hasFilters = typeFilter !== "all" || categoryFilter !== "all" || monthYearFilter !== "all" || dateFrom || dateTo;
  const clearFilters = () => { setTypeFilter("all"); setCategoryFilter("all"); setMonthYearFilter("all"); setDateFrom(""); setDateTo(""); };

  return (
    <div>
      <TransactionDrawer open={drawerOpen} onClose={() => setDrawerOpen(false)} transactions={drawerTxns} title={drawerTitle} />

      {/* Filters */}
      <div className="filters">
        <div className="filters-header">
          <span>⚡ Filters</span>
          {hasFilters && <button className="clear-btn" onClick={clearFilters}>Clear all</button>}
        </div>
        <div className="filter-row">
          <select className="filter-select" value={typeFilter} onChange={e => setTypeFilter(e.target.value)}>
            <option value="all">All Types</option>
            <option value="Income">Income</option>
            <option value="Expense">Expense</option>
          </select>
          <select className="filter-select" value={categoryFilter} onChange={e => setCategoryFilter(e.target.value)}>
            <option value="all">All Categories</option>
            {categories.map(c => <option key={c} value={c}>{c}</option>)}
          </select>
          <select className="filter-select" value={monthYearFilter} onChange={e => setMonthYearFilter(e.target.value)}>
            <option value="all">All Months</option>
            {monthYears.map(m => <option key={m} value={m}>{m}</option>)}
          </select>
          <input type="date" className="filter-input" value={dateFrom} onChange={e => setDateFrom(e.target.value)} title="From date" />
          <input type="date" className="filter-input" value={dateTo} onChange={e => setDateTo(e.target.value)} title="To date" />
        </div>
      </div>

      {/* Summary Cards */}
      <div className="cards">
        <div className="card" onClick={() => showDrawer("Income Transactions", filtered.filter(t => t.type === "Income"))}>
          <div className="card-label"><span className="dot" style={{background:"var(--primary)"}} /> Total Income</div>
          <div className="card-value income">{fmt(totalIncome)}</div>
          <div className="card-hint">Click to view transactions</div>
        </div>
        <div className="card" onClick={() => showDrawer("Expense Transactions", filtered.filter(t => t.type === "Expense"))}>
          <div className="card-label"><span className="dot" style={{background:"var(--danger)"}} /> Total Expenses</div>
          <div className="card-value expense">{fmt(totalExpense)}</div>
          <div className="card-hint">Click to view transactions</div>
        </div>
        <div className="card" onClick={() => showDrawer("All Transactions", filtered)}>
          <div className="card-label"><span className="dot" style={{background:balance >= 0 ? "var(--primary)" : "var(--danger)"}} /> Net Balance</div>
          <div className={`card-value ${balance >= 0 ? "income" : "expense"}`}>{fmt(balance)}</div>
          <div className="card-hint">Click to view all</div>
        </div>
      </div>

      {/* Charts Row 1 */}
      <div className="charts-grid">
        <div className="chart-card">
          <h3>Monthly Income vs Expense</h3>
          <div className="hint">Click a bar to see transactions</div>
          <div style={{height:300}}>
            <ResponsiveContainer width="100%" height="100%">
              <BarChart data={monthlyTrend} onClick={d => { if(d?.activeLabel){ const m=d.activeLabel; showDrawer(`Transactions — ${m}`, filtered.filter(t=>t.monthYear===m)); }}}>
                <CartesianGrid strokeDasharray="3 3" stroke="#e5e7eb" />
                <XAxis dataKey="month" tick={{fontSize:11}} />
                <YAxis tick={{fontSize:11}} />
                <Tooltip formatter={v => fmt(v)} />
                <Legend />
                <Bar dataKey="income" name="Income" fill="#0d9668" radius={[4,4,0,0]} />
                <Bar dataKey="expense" name="Expense" fill="#dc2626" radius={[4,4,0,0]} />
              </BarChart>
            </ResponsiveContainer>
          </div>
        </div>
        <div className="chart-card">
          <h3>Income vs Expense Split</h3>
          <div className="hint">Click a slice to see transactions</div>
          <div style={{height:300}}>
            <ResponsiveContainer width="100%" height="100%">
              <PieChart>
                <Pie data={typeData} cx="50%" cy="50%" innerRadius={60} outerRadius={100} dataKey="value"
                  onClick={(_, i) => { const type = i===0?"Income":"Expense"; showDrawer(`${type} Transactions`, filtered.filter(t=>t.type===type)); }}
                  label={({name,percent})=>`${name} ${(percent*100).toFixed(0)}%`}>
                  <Cell fill="#0d9668" />
                  <Cell fill="#dc2626" />
                </Pie>
                <Tooltip formatter={v => fmt(v)} />
              </PieChart>
            </ResponsiveContainer>
          </div>
        </div>
      </div>

      {/* Charts Row 2 */}
      <div className="charts-grid">
        <div className="chart-card">
          <h3>Category Breakdown</h3>
          <div className="hint">Click a category to see transactions</div>
          <div style={{height:350}}>
            <ResponsiveContainer width="100%" height="100%">
              <BarChart data={categoryData} layout="vertical" margin={{left:20}}
                onClick={d => { if(d?.activeLabel){ const c=d.activeLabel; showDrawer(`${c} Transactions`, filtered.filter(t=>t.category===c)); }}}>
                <CartesianGrid strokeDasharray="3 3" stroke="#e5e7eb" />
                <XAxis type="number" tick={{fontSize:11}} />
                <YAxis type="category" dataKey="name" tick={{fontSize:10}} width={140} />
                <Tooltip formatter={v => fmt(v)} />
                <Bar dataKey="value" name="Amount" radius={[0,4,4,0]}>
                  {categoryData.map((_,i) => <Cell key={i} fill={COLORS[i%COLORS.length]} />)}
                </Bar>
              </BarChart>
            </ResponsiveContainer>
          </div>
        </div>
        <div className="chart-card">
          <h3>Top Transaction Parties</h3>
          <div className="hint">Click a party to see transactions</div>
          <div style={{height:350}}>
            <ResponsiveContainer width="100%" height="100%">
              <BarChart data={partyData} layout="vertical" margin={{left:10}}
                onClick={d => { if(d?.activeLabel){ const p=d.activeLabel; showDrawer(`${p} Transactions`, filtered.filter(t=>t.party===p)); }}}>
                <CartesianGrid strokeDasharray="3 3" stroke="#e5e7eb" />
                <XAxis type="number" tick={{fontSize:11}} />
                <YAxis type="category" dataKey="name" tick={{fontSize:10}} width={100} />
                <Tooltip formatter={v => fmt(v)} />
                <Bar dataKey="value" name="Amount" fill="#3b82f6" radius={[0,4,4,0]} />
              </BarChart>
            </ResponsiveContainer>
          </div>
        </div>
      </div>

      {/* Cumulative */}
      <div className="chart-card chart-full">
        <h3>Cumulative Balance Trend</h3>
        <div className="hint">Click a point to see that month's transactions</div>
        <div style={{height:300}}>
          <ResponsiveContainer width="100%" height="100%">
            <LineChart data={cumulativeData}
              onClick={d => { if(d?.activeLabel){ const m=d.activeLabel; showDrawer(`Transactions — ${m}`, filtered.filter(t=>t.monthYear===m)); }}}>
              <CartesianGrid strokeDasharray="3 3" stroke="#e5e7eb" />
              <XAxis dataKey="month" tick={{fontSize:11}} />
              <YAxis tick={{fontSize:11}} />
              <Tooltip formatter={v => fmt(v)} />
              <Line type="monotone" dataKey="balance" name="Balance" stroke="#0d9668" strokeWidth={2} dot={{r:3}} />
            </LineChart>
          </ResponsiveContainer>
        </div>
      </div>

      <div className="footer">Showing {filtered.length} of {transactions.length} transactions</div>
    </div>
  );
}

function DataTable({ headers, rows }) {
  return (
    <div className="data-table-wrap">
      <table className="data-table">
        <thead><tr>{headers.map((h,i) => <th key={i}>{h}</th>)}</tr></thead>
        <tbody>{rows.map((r,i) => <tr key={i}>{r.map((c,j) => <td key={j}>{c}</td>)}</tr>)}</tbody>
      </table>
    </div>
  );
}

function App() {
  const [loading, setLoading] = useState(true);
  const [data, setData] = useState(null);
  const [transactions, setTransactions] = useState([]);
  const [tab, setTab] = useState("dashboard");
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [url, setUrl] = useState(SHEET_URL);
  const [sheet, setSheet] = useState(SHEET_NAME);
  const [error, setError] = useState("");

  const loadData = async (u, s) => {
    setLoading(true); setError("");
    try {
      const result = await fetchSheetData(u, s);
      setData(result);
      setTransactions(parseTransactions(result.rows));
    } catch (e) {
      setError(e.message); setData(null); setTransactions([]);
    } finally { setLoading(false); }
  };

  useEffect(() => { loadData(SHEET_URL, SHEET_NAME); }, []);

  return (
    <div>
      <header className="header">
        <div className="container header-inner">
          <div className="logo">
            <div className="logo-icon">PP</div>
            <div><h1>Paradise Pearl Accounting</h1><p>Society Transaction Dashboard</p></div>
          </div>
          <button className="settings-btn" onClick={() => setSettingsOpen(!settingsOpen)}>⚙ Settings</button>
        </div>
        <div className={`settings-panel ${settingsOpen ? "open" : ""}`}>
          <div className="container">
            <div className="settings-row">
              <div className="field">
                <label>Google Sheet URL</label>
                <input value={url} onChange={e => setUrl(e.target.value)} placeholder="Paste sheet URL" />
              </div>
              <div className="field">
                <label>Sheet Tab Name</label>
                <input value={sheet} onChange={e => setSheet(e.target.value)} placeholder="e.g. Sheet1" style={{width:160}} />
              </div>
              <button className="load-btn" disabled={loading} onClick={() => loadData(url, sheet)}>
                {loading ? "Loading..." : "Load Data"}
              </button>
            </div>
            {error && <div style={{color:"var(--danger)",fontSize:12,marginTop:8}}>{error}</div>}
          </div>
        </div>
      </header>

      <div className="container" style={{paddingTop:20,paddingBottom:40}}>
        {loading ? (
          <div className="loading">{[...Array(6)].map((_,i) => <div key={i} className="shimmer" style={{animationDelay:`${i*.1}s`}} />)}</div>
        ) : data ? (
          <>
            <div className="tabs">
              <button className={`tab ${tab==="dashboard"?"active":""}`} onClick={()=>setTab("dashboard")}>📊 Dashboard</button>
              <button className={`tab ${tab==="table"?"active":""}`} onClick={()=>setTab("table")}>📋 Raw Data</button>
            </div>
            {tab === "dashboard" ? <Dashboard transactions={transactions} /> : <DataTable headers={data.headers} rows={data.rows} />}
          </>
        ) : (
          <div style={{textAlign:"center",padding:"60px 0",color:"var(--muted)"}}>
            <p style={{fontSize:14}}>No data loaded. Open Settings to configure your sheet.</p>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
