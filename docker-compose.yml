version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: society_nginx
    ports:
      - "11080:80"    # Expose HTTP port 80
      - "11443:443"  # Expose HTTPS port 443
    volumes:
      - ./html:/usr/share/nginx/html:ro  # Map your HTML directory to NGINX's default root
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro # Use a custom NGINX config
      - /volume1/.@plugins/AppCentral/letsencrypt/.CertBot/config:/etc/letsencrypt:ro # Map SSL certificates
    restart: always

